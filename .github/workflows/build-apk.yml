name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      EXPO_NO_TELEMETRY: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Не ставим устаревший пакет `tools` — его больше нет в sdkmanager
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install dependencies
        run: npm ci

      - name: Prebuild native Android project
        run: npx expo prebuild --platform android --no-install --non-interactive

      - name: Allow CI release APK without custom keystore
        run: bash scripts/patch-android-signing.sh

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          VERSION=$(node -p "require('./app.json').expo.version")
          OUT="watermelon-airsoft-${VERSION}-b${GITHUB_RUN_NUMBER}.apk"
          cp "$APK_PATH" "$OUT"
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK_PATH → $OUT"
          ls -lh "$OUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: watermelon-airsoft-${{ github.sha }}
          path: ${{ steps.apk.outputs.file }}
          if-no-files-found: error
          retention-days: 30

      # Artifacts ≠ Releases. Кладём APK в GitHub Release на push в main/master
      # и при ручном запуске workflow (не на PR).
      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk.outputs.version }}-b${{ github.run_number }}
          name: Watermelon Airsoft v${{ steps.apk.outputs.version }} (build ${{ github.run_number }})
          files: ${{ steps.apk.outputs.file }}
          generate_release_notes: true
          fail_on_unmatched_files: true
